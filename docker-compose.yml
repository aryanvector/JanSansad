services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    environment:
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/snapshots/snapshots
    volumes:
      - qdrant_data:/qdrant/storage
      - app_data:/snapshots

  app:
    image: lok-sabha-rag-app
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
    volumes:
      - app_data:/app/data
      - ./frontend:/app/frontend:ro
      - ./src:/app/src:ro
    depends_on:
      - qdrant

volumes:
  qdrant_data:
  app_data:
